name: build

on: [push, pull_request]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        cc: ["gcc", "clang"]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libxkbcommon-dev xorg-dev
      - name: Build
        run: |
          ${{matrix.cc}} -march=native -O3 build.c -Iexternal/include -o build && \
          ./build --tests && \
          ./build --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Build
        shell: pwsh
        run: |
          clang -march=native -O3 -fms-extensions build.c -o build.exe
          .\build.exe --tests
          .\build.exe --debug
